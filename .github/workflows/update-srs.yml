name: Update Russia Mobile Whitelist SRS

on:
  schedule:
    - cron: '0 3 * * *'          # Каждый день в 3:00 UTC
  workflow_dispatch:             # Возможность ручного запуска

permissions:
  contents: write

jobs:
  update-srs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Запуск скрипта генерации SRS
        run: |
          chmod +x scripts/generate_srs.sh
          ./scripts/generate_srs.sh

      - name: Проверка изменений
        id: changes
        run: |
          git diff --quiet russia-mobile-whitelist.lst russia-mobile-whitelist.srs || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Коммит и пуш
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add russia-mobile-whitelist.lst russia-mobile-whitelist.srs
          git commit -m "Автообновление: russia-mobile-whitelist [skip ci]"
          git push

      - name: Уведомление в Telegram (опционально)
        if: steps.changes.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Проверяем, заданы ли секреты. Если нет — просто пропускаем шаг без ошибки.
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Секреты Telegram не заданы, пропускаем уведомление."
            exit 0
          fi
          
          MESSAGE="🔔 *Обновлён список russia-mobile-whitelist*%0A%0A📁 \`russia-mobile-whitelist.lst\`%0A📦 \`russia-mobile-whitelist.srs\`%0A🔗 [Смотреть файлы](https://github.com/${{ github.repository }})%0A📦 [Коммит](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MESSAGE}"
